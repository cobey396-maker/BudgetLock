<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17171C" />
    <title>Offline · BudgetLock</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #131318; color: #f2f2f5;
        font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 14px; padding: 32px; text-align: center;
      }
      h1 { font-size: 22px; font-weight: 700; margin: 6px 0 0; letter-spacing: -0.3px; }
      p { font-size: 15px; line-height: 1.55; color: #8b8b96; margin: 0; max-width: 300px; }
      button {
        margin-top: 12px; height: 48px; padding: 0 26px; border: none; border-radius: 14px;
        background: linear-gradient(135deg, #5ff0b6 0%, #2bc286 100%);
        color: #10251c; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-128.png" width="72" height="72" alt="" />
      <h1>You're offline</h1>
      <p>BudgetLock needs a connection to load your spending. Your data is safe — reconnect and pick up where you left off.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
